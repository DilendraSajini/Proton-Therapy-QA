<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Giraffe QA Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
     
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .chart-container {
            width: 90%;
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>

<body>
     
    <h1>Giraffe QA Dashboard</h1>
     
    <div class="chart-container">
        <canvas id="ptprChart"></canvas>
    </div>
     
    {{ labels|json_script:"labels-data" }}
    {{ values|json_script:"values-data" }}
     
    <script>
        const labels = JSON.parse(
            document.getElementById("labels-data").textContent
        );

        const values = JSON.parse(
            document.getElementById("values-data").textContent
        );

        new Chart(
            document.getElementById("ptprChart"),
            {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [{
                        label: "Average PTPR",
                        data: values,
                        borderColor: "blue",
                        borderWidth: 2,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true
                }
            }
        );
    </script>
     
</body>

</html>
